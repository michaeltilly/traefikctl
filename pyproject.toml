[project]
name = "traefikctl"
version = "1.0.0"
description = "TillyNet service publishing tool — generates Traefik dynamic config files"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "dnspython>=2.6",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
traefikctl = "traefikctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traefikctl*"]

[tool.setuptools.package-data]
traefikctl = ["templates/*.j2", "web/templates/*.html"]
